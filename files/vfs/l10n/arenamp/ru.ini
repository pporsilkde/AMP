hotkey.bloom_off = Bloom выключен
settings.optimized_distance = Адаптивная дальность мира, теней и травы
settings.optimized_distance_value = Адаптивная дальность: %s
settings.tooltip.land_optimization = Динамически регулирует дальность на открытой местности. При включении появляется ползунок целевой дальности от 4 000 до 40 000, связанный с тенями и травой. Если FPS падает ниже выбранной цели, движок может плавно уменьшить все три расстояния до 50% и вернуть их после восстановления производительности.
settings.tooltip.optimized_distance = Задаёт желаемую максимальную дальность на улице. Тени используют 25%, а трава — 40% этого значения. Адаптивная оптимизация может временно уменьшить фактическую дальность вдвое, не изменяя выбранное значение.
