# ArenaMP U025 — keys for files/vfs/l10n/arenamp/en.ini
# Appended to en.ini. The key set must match u025-ru.ini exactly: both files
# in the current tree hold exactly 867 keys, and any divergence shows up as
# English text in a Russian build (or the other way round).
# Engine side only (localizeArena in GUIChat). Launcher strings do NOT go
# here: the launcher has its own table, components/misc/arenarussiantranslator.hpp.

# ── in-game voice indicator ───────────────────────────────────────
voice.hud.speaking = Speaking: %{name}
voice.hud.speaking_hidden = Speaking: ???
voice.hud.speaking_many = Speaking: %{count}
voice.hud.muted = Microphone off
voice.hud.ptt_hint = Hold %{key} to talk
voice.hud.proximity = Proximity voice
voice.hud.group = Group channel
voice.hud.no_bridge = Voice unavailable: the launcher is closed
voice.hud.server_off = Voice is disabled on this server

# ── chat commands ─────────────────────────────────────────────────
chat.link.code = Launcher chat sign-in code: %{code}
chat.link.hint = The code is valid for 5 minutes and can be used once.
chat.link.failed = Could not issue a code. Try again later.
chat.link.disabled = Launcher chat is disabled on this server.
chat.link.from_launcher = from the launcher
