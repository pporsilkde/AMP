# ArenaMP U025 — ключи для files/vfs/l10n/arenamp/ru.ini
# Дописываются в конец ru.ini. Набор ключей обязан совпадать с u025-en.ini:
# в текущем дереве оба файла держат ровно по 867 ключей, расхождение означает
# английский текст в русской сборке (или наоборот).
# Это движковая часть (localizeArena в GUIChat). Строки лаунчера сюда НЕ идут:
# у него своя таблица, components/misc/arenarussiantranslator.hpp.

# ── индикация голоса в игре ───────────────────────────────────────
voice.hud.speaking = Говорит: %{name}
voice.hud.speaking_hidden = Говорит: ???
voice.hud.speaking_many = Говорят: %{count}
voice.hud.muted = Микрофон выключен
voice.hud.ptt_hint = Удерживайте %{key}, чтобы говорить
voice.hud.proximity = Голос по расстоянию
voice.hud.group = Групповой канал
voice.hud.no_bridge = Голос недоступен: лаунчер закрыт
voice.hud.server_off = Голос на сервере выключен

# ── команды чата ──────────────────────────────────────────────────
chat.link.code = Код для входа в чат лаунчера: %{code}
chat.link.hint = Код действует 5 минут и используется один раз.
chat.link.failed = Не удалось выдать код. Повторите позже.
chat.link.disabled = Чат лаунчера на этом сервере выключен.
chat.link.from_launcher = из лаунчера
