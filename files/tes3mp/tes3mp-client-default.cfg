[General]
destinationAddress = localhost
port = 25565
password =
# 0 - Verbose (spam), 1 - Info, 2 - Warnings, 3 - Errors, 4 - Only fatal errors
logLevel = 0

[Master]
address = master.tes3mp.com
port = 25561

# Chat keys and geometry: settings.cfg [Chat] (defaults in settings-default.cfg).

[Voice]
# ArenaMP Y033 proximity voice. Hold pushToTalkKey to transmit.
enabled = true
pushToTalkKey = V
# Playback attenuation distance; server has the authoritative routing range.
rangeMeters = 30
# U035: speakers closer than this are heard at full volume; past it the voice
# fades out towards rangeMeters. This is the main loudness knob - raise it first.
fullVolumeMeters = 12
# Source gain for voice playback. Compensates the [Sound] voice volume slider
# without making NPC dialogue louder. OpenAL clamps the result, so it cannot
# distort; values above ~2.5 stop having any effect.
sourceVolume = 2.0
# Digital microphone boost applied before encoding (2.0 = +6 dB). Raise for
# quiet headsets; a soft limiter keeps peaks from distorting.
micGain = 1.5
# Digital boost applied to received voice (2.0 = +6 dB). Raise only if voices
# are still too quiet after fullVolumeMeters and sourceVolume.
playbackGain = 1.0
# U035 radio mode. false = classic push-to-talk, hold the key to speak.
# true = the key latches: press once to open the microphone, press again to
# close it. The HUD overlay shows an amber "microphone open" line whenever the
# mic is latched but you are not speaking, so it can never stay open unnoticed.
toggleMode = false
