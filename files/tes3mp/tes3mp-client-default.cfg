[General]
destinationAddress = localhost
port = 25565
password =
# 0 - Verbose (spam), 1 - Info, 2 - Warnings, 3 - Errors, 4 - Only fatal errors
logLevel = 0

[Master]
address = master.tes3mp.com
port = 25561

# Chat keys and geometry: settings.cfg [Chat] (defaults in settings-default.cfg).

[Voice]
# ArenaMP proximity voice microphone transmit. Enabled by default; V works as radio toggle.
# Setting enabled=false disables only your microphone; incoming player voice still plays.
enabled = true
pushToTalkKey = V
# Recording device selected by the PC launcher. Empty = system default.
captureDevice =
# Playback attenuation distance; server has the authoritative routing range.
rangeMeters = 30
# U035: speakers closer than this are heard at full volume; past it the voice
# fades out towards rangeMeters. This is the main loudness knob - raise it first.
fullVolumeMeters = 12
# Source gain for voice playback. Compensates the [Sound] voice chat volume slider
# without making NPC dialogue louder. Values above 1 amplify the OpenAL source;
# raise this gradually and prefer fullVolumeMeters before extreme gain values.
sourceVolume = 2.0
# Digital microphone boost applied before encoding (2.0 = +6 dB). Raise for
# quiet headsets; a soft limiter keeps peaks from distorting.
micGain = 1.5
# Digital boost applied to received voice (2.0 = +6 dB). Raise only if voices
# are still too quiet after fullVolumeMeters and sourceVolume.
playbackGain = 1.0
# Radio mode is the ArenaMP default: press V once to open the microphone and
# press V again to close it. The HUD overlay shows when the microphone is open.
toggleMode = true
