name: ArenaMP Android APK

on:
  workflow_dispatch:
    inputs:
      clean_arenamp_build:
        description: Ignore the cached ArenaMP source/build tree for this run (third-party dependencies stay cached)
        required: false
        default: false
        type: boolean
      arenamp_ref:
        description: Network compatibility commit SHA to advertise. Sources are always built from the latest AMP/main branch.
        required: false
        default: 0f659371bcbaf9e7e6b94bd6bcb7a81970082234
        type: string
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'

concurrency:
  group: arenamp-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      BUILD_JOBS: 1
      LTO: "false"
      LTO_JOBS: 1
      GENERATE_DEBUG_SYMBOLS: "false"
      ARENAMP_REPOSITORY: https://github.com/pporsilkde/AMP.git
      # Build source and network compatibility identity are intentionally separate.
      # The Android client/server always compile the current AMP/main sources, while
      # the compatibility SHA remains the value expected by the distributed PC server.
      ARENAMP_SOURCE_REF: main
      ARENAMP_GIT_TAG: main
      ARENAMP_NETWORK_COMMIT: ${{ inputs.arenamp_ref || '0f659371bcbaf9e7e6b94bd6bcb7a81970082234' }}
      GL4ES_GIT_REPOSITORY: https://github.com/Sisah2/NG-GL4ES.git
      GL4ES_GIT_TAG: Openmw3
      ARENAMP_INCREMENTAL_CACHE_EPOCH: arenamp-android-y001r2-russo-main-v3
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

    steps:
      - name: Checkout Android builder
        uses: actions/checkout@v4

      # GitHub's web upload / ZIP extraction does not reliably preserve Unix executable bits.
      # Make every script used by the original builder executable before the first native step.
      - name: Restore executable permissions
        shell: bash
        run: |
          find buildscripts -type f -name '*.sh' -exec chmod +x {} +
          chmod +x gradlew
          if [ -f storagechooser/gradlew ]; then chmod +x storagechooser/gradlew; fi
          if [ -f CI/travis.sh ]; then chmod +x CI/travis.sh; fi

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake curl git patch unzip gettext-base \
            autoconf automake libtool pkg-config python3 ccache ninja-build

      # Modern sdkmanager itself needs Java 17. Gradle does not use this JDK.
      - name: Set up JDK 17 for sdkmanager
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 29
        shell: bash
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;29.0.3"

      # Keep the original AGP 4.0.2 / Gradle 6.1.1 combination on Java 11.
      - name: Set up JDK 11 for original Gradle toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Restore original native dependency cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            buildscripts/downloads
            buildscripts/toolchain
            buildscripts/prefix/arm64
            buildscripts/build/arm64
          key: arenamp-original-r21e-arm64-v8-luajit-v21-luacpp-nolto-deps-v1
          restore-keys: |
            arenamp-original-r21e-arm64-v8-luajit-v21-luacpp-nolto-

      # V1.4 changes only ArenaMP/client/server code. Reuse the already-built
      # NDK/Boost/OSG/NG-GL4ES/RakNet/LuaJIT checkpoint even when it was
      # restored through an older cache key. Do not rebuild third-party libs.
      - name: Verify restored native dependency checkpoint
        id: native-deps
        shell: bash
        run: |
          set -euo pipefail
          READY=true
          for file in \
            buildscripts/prefix/arm64/lib/libluajit-5.1.a \
            buildscripts/prefix/arm64/lib/libRakNetLibStatic.a \
            buildscripts/prefix/arm64/lib/libopenal.so \
            buildscripts/prefix/arm64/lib/libSDL2.so \
            buildscripts/prefix/arm64/lib/libng_gl4es.so \
            buildscripts/prefix/arm64/include/boost/version.hpp \
            buildscripts/prefix/arm64/include/osg/Node; do
            if [[ ! -f "$file" ]]; then
              echo "Missing dependency checkpoint file: $file"
              READY=false
            fi
          done
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [[ "$READY" == true ]]; then
            echo '==> Native dependency checkpoint is complete; third-party libraries will not be rebuilt.'
          fi

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.ccache
          key: arenamp-ccache-arm64-${{ github.run_id }}
          restore-keys: |
            arenamp-ccache-arm64-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=4G
          ccache --zero-stats || true

      # Build expensive third-party libraries once. Save them before compiling
      # ArenaMP, so an ArenaMP compiler error does not throw away the dependency work.
      - name: Build native dependencies
        if: steps.native-deps.outputs.ready != 'true'
        working-directory: buildscripts
        run: bash ./build.sh --arch arm64 --ccache --release --dependencies-only

      - name: Strip ArenaMP objects from native dependency checkpoint
        shell: bash
        run: rm -rf buildscripts/build/arm64/arenamp-prefix

      - name: Save native dependency cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            buildscripts/downloads
            buildscripts/toolchain
            buildscripts/prefix/arm64
            buildscripts/build/arm64
          key: arenamp-original-r21e-arm64-v8-luajit-v21-luacpp-nolto-deps-v1

      - name: Verify LuaJIT server SDK
        shell: bash
        run: |
          test -f buildscripts/prefix/arm64/lib/libluajit-5.1.a
          test -f buildscripts/prefix/arm64/include/luajit-2.1/lua.h
          test -f buildscripts/prefix/arm64/include/luajit-2.1/lua.hpp
          test -f buildscripts/prefix/arm64/include/luajit-2.1/lauxlib.h
          test -f buildscripts/prefix/arm64/include/luajit-2.1/lualib.h
          test -f buildscripts/prefix/arm64/include/luajit-2.1/luajit.h
          echo 'LuaJIT C/C++ headers + static library validated.'

      # The dependency cache is intentionally independent of ArenaMP objects.
      # Remove a legacy arenamp-prefix if an older cache happened to contain it;
      # the V1.4 incremental cache is restored only after this cleanup. On the
      # first V1.4 run this guarantees a full client+server rebuild while all
      # expensive native dependencies remain intact.
      - name: Isolate native dependencies from ArenaMP build tree
        shell: bash
        run: rm -rf buildscripts/build/arm64/arenamp-prefix

      - name: Drop ArenaMP incremental tree on request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_arenamp_build == true }}
        shell: bash
        run: rm -rf buildscripts/build/arm64/arenamp-prefix

      # Keep ArenaMP's own source + CMake build tree between CI runs.  The cache
      # key is intentionally unique per run, while restore-keys select the most
      # recent compatible tree.  This is the Android equivalent of the Windows
      # incremental build cache: unchanged .cpp files remain up-to-date.
      - name: Restore incremental ArenaMP build tree
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.clean_arenamp_build == false }}
        uses: actions/cache/restore@v4
        with:
          path: buildscripts/build/arm64/arenamp-prefix
          key: ${{ env.ARENAMP_INCREMENTAL_CACHE_EPOCH }}-${{ hashFiles('buildscripts/build.sh', 'buildscripts/CMakeLists.txt', 'buildscripts/include/version.sh', 'buildscripts/patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.ARENAMP_INCREMENTAL_CACHE_EPOCH }}-${{ hashFiles('buildscripts/build.sh', 'buildscripts/CMakeLists.txt', 'buildscripts/include/version.sh', 'buildscripts/patches/**') }}-

      # ExternalProject keeps the checked-out AMP repository inside arenamp-prefix.
      # This step compares the cached ArenaMP revision against AMP/main.
      # ARENAMP_NETWORK_COMMIT is deliberately NOT used for source checkout.
      # fetches only when the requested ref moved, and keeps the binary directory.
      # CMake/Ninja then recompiles only changed .cpp files and translation units
      # affected by changed headers instead of rebuilding the whole TES3MP client.
      - name: Check ArenaMP repository and prepare incremental source update
        id: arenamp-source
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="buildscripts/build/arm64/arenamp-prefix"
          SRC="$PREFIX/src/arenamp"
          STAMP="$PREFIX/src/arenamp-stamp"
          PATCH_HASH_FILE="$PREFIX/.arenamp-android-patch-hash"
          CHANGED_FILE_LIST="$GITHUB_WORKSPACE/arenamp-changed-files.txt"
          CHANGED_CPP_LIST="$GITHUB_WORKSPACE/arenamp-changed-cpp.txt"
          : > "$CHANGED_FILE_LIST"
          : > "$CHANGED_CPP_LIST"

          PATCH_HASH="$({
            find buildscripts/patches -type f -print0 | sort -z | xargs -0 sha256sum
          } | sha256sum | awk '{print $1}')"
          echo "ARENAMP_PATCH_HASH=$PATCH_HASH" >> "$GITHUB_ENV"

          REQUESTED_REF="$ARENAMP_SOURCE_REF"
          if [[ "$REQUESTED_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            TARGET_SHA="${REQUESTED_REF,,}"
          else
            TARGET_SHA="$(git ls-remote "$ARENAMP_REPOSITORY" "refs/heads/$REQUESTED_REF" | awk 'NR==1 {print $1}')"
            if [[ -z "$TARGET_SHA" ]]; then
              TARGET_SHA="$(git ls-remote "$ARENAMP_REPOSITORY" "$REQUESTED_REF" | awk 'NR==1 {print $1}')"
            fi
            if [[ -z "$TARGET_SHA" ]]; then
              echo "::error::Could not resolve ArenaMP ref '$REQUESTED_REF' from $ARENAMP_REPOSITORY"
              exit 1
            fi
          fi

          LATEST_MAIN_SHA="$(git ls-remote "$ARENAMP_REPOSITORY" refs/heads/main | awk 'NR==1 {print $1}')"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "latest_main_sha=$LATEST_MAIN_SHA" >> "$GITHUB_OUTPUT"
          # Freeze this run to the AMP/main head resolved above. This is not a
          # compatibility pin: the next workflow run resolves main again.
          echo "ARENAMP_GIT_TAG=$TARGET_SHA" >> "$GITHUB_ENV"

          {
            echo '## ArenaMP repository check'
            echo
            echo "- Source ref: \`$REQUESTED_REF\`"
            echo "- Build source revision: \`$TARGET_SHA\`"
            echo "- Network compatibility commit: \`$ARENAMP_NETWORK_COMMIT\`"
            if [[ -n "$LATEST_MAIN_SHA" ]]; then
              echo "- Current AMP/main: \`$LATEST_MAIN_SHA\`"
              if [[ "$TARGET_SHA" != "$LATEST_MAIN_SHA" ]]; then
                echo '::warning::Resolved source revision is not the current AMP/main head.'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -d "$SRC/.git" ]]; then
            echo "==> No cached ArenaMP checkout; ExternalProject will clone $REQUESTED_REF ($TARGET_SHA)"
            # A partial source cache can prevent ExternalProject from cloning cleanly.
            if [[ -e "$SRC" && ! -d "$SRC/.git" ]]; then
              rm -rf "$PREFIX"
            fi
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
            echo "cpp_changed=cold-build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C "$SRC" remote set-url origin "$ARENAMP_REPOSITORY"
          LOCAL_SHA="$(git -C "$SRC" rev-parse HEAD)"
          OLD_PATCH_HASH=""
          [[ -f "$PATCH_HASH_FILE" ]] && OLD_PATCH_HASH="$(cat "$PATCH_HASH_FILE")"

          echo "==> Cached ArenaMP base:    $LOCAL_SHA"
          echo "==> Requested ArenaMP base: $TARGET_SHA"
          echo "==> Cached patch hash:       ${OLD_PATCH_HASH:-none}"
          echo "==> Current patch hash:      $PATCH_HASH"

          # Make the target object available locally so git diff can enumerate the
          # exact C/C++ files changed between CI runs before checkout.
          if ! git -C "$SRC" cat-file -e "$TARGET_SHA^{commit}" 2>/dev/null; then
            if [[ "$REQUESTED_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
              git -C "$SRC" fetch --depth=1 origin "$TARGET_SHA" || git -C "$SRC" fetch origin "$TARGET_SHA"
            else
              git -C "$SRC" fetch --depth=100 origin "$REQUESTED_REF"
            fi
          fi

          SOURCE_CHANGED=false
          PATCH_CHANGED=false
          if [[ "$LOCAL_SHA" != "$TARGET_SHA" ]]; then
            SOURCE_CHANGED=true
            git -C "$SRC" diff --name-only "$LOCAL_SHA" "$TARGET_SHA" > "$CHANGED_FILE_LIST" || true
            git -C "$SRC" diff --name-only "$LOCAL_SHA" "$TARGET_SHA" -- \
              '*.c' '*.cc' '*.cpp' '*.cxx' '*.m' '*.mm' > "$CHANGED_CPP_LIST" || true
          fi
          if [[ "$OLD_PATCH_HASH" != "$PATCH_HASH" ]]; then
            PATCH_CHANGED=true
          fi

          CPP_COUNT="$(grep -c . "$CHANGED_CPP_LIST" || true)"
          FILE_COUNT="$(grep -c . "$CHANGED_FILE_LIST" || true)"
          echo "source_changed=$SOURCE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "patch_changed=$PATCH_CHANGED" >> "$GITHUB_OUTPUT"
          echo "cpp_changed=$CPP_COUNT" >> "$GITHUB_OUTPUT"
          echo "files_changed=$FILE_COUNT" >> "$GITHUB_OUTPUT"

          {
            echo "- Cached revision: \`$LOCAL_SHA\`"
            echo "- Repository files changed: **$FILE_COUNT**"
            echo "- Directly changed C/C++ sources: **$CPP_COUNT**"
            if [[ "$CPP_COUNT" -gt 0 ]]; then
              echo
              echo '<details><summary>Changed C/C++ files</summary>'
              echo
              echo '```text'
              sed -n '1,200p' "$CHANGED_CPP_LIST"
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$SOURCE_CHANGED" == false && "$PATCH_CHANGED" == false && -f "$STAMP/arenamp-patch_disconnected" ]]; then
            echo '==> ArenaMP source and Android patches are unchanged; preserving source/object mtimes'
            exit 0
          fi

          echo '==> Updating ArenaMP source/patch state while preserving the existing binary tree'
          # Android patches intentionally leave SOURCE_DIR dirty. Return to its
          # clean upstream commit before moving revisions or applying a new patch set.
          git -C "$SRC" reset --hard HEAD
          git -C "$SRC" clean -fdx
          if [[ "$LOCAL_SHA" != "$TARGET_SHA" ]]; then
            git -C "$SRC" checkout --detach "$TARGET_SHA"
          fi

          # UPDATE_DISCONNECTED=TRUE creates *_disconnected stamps. Removing only
          # these steps preserves <BINARY_DIR> and all valid object files.
          rm -f \
            "$STAMP/arenamp-update_disconnected" \
            "$STAMP/arenamp-patch_disconnected" \
            "$STAMP/arenamp-update" \
            "$STAMP/arenamp-patch" \
            "$STAMP/arenamp-configure" \
            "$STAMP/arenamp-build" \
            "$STAMP/arenamp-install" \
            "$STAMP/arenamp-done" \
            buildscripts/build/arm64/CMakeFiles/arenamp-complete

          echo '==> Binary tree kept. CMake/Ninja will rebuild changed/affected translation units only.'

      - name: Show ArenaMP changed C++ files
        if: always()
        shell: bash
        run: |
          echo '=== ArenaMP changed C/C++ files for this source update ==='
          if [[ -s arenamp-changed-cpp.txt ]]; then
            cat arenamp-changed-cpp.txt
          else
            echo '(none, or cold build without a previous cached revision)'
          fi

      - name: Ensure linker safety swap
        shell: bash
        run: |
          echo '==> Memory before swap check'
          free -h || true

          # GitHub-hosted runners may already have swap enabled.  Never touch an
          # active /swapfile: trying to fallocate it again fails with "Text file busy".
          EXISTING_SWAP_MB=$(free -m | awk '/^Swap:/ {print $2}')
          EXISTING_SWAP_MB=${EXISTING_SWAP_MB:-0}

          if [ "$EXISTING_SWAP_MB" -ge 2048 ]; then
            echo "==> Existing swap is already ${EXISTING_SWAP_MB} MiB; keeping it"
          else
            AVAILABLE_MB=$(df --output=avail -m / | tail -n 1 | tr -d ' ')
            EXTRA_SWAP=/mnt/arenamp-linker.swap

            if [ "${AVAILABLE_MB:-0}" -ge 7000 ]; then
              echo "==> Existing swap is only ${EXISTING_SWAP_MB} MiB; trying to add 3 GiB at ${EXTRA_SWAP}"
              sudo swapoff "$EXTRA_SWAP" 2>/dev/null || true
              sudo rm -f "$EXTRA_SWAP" 2>/dev/null || true

              if sudo fallocate -l 3G "$EXTRA_SWAP" 2>/dev/null ||                  sudo dd if=/dev/zero of="$EXTRA_SWAP" bs=1M count=3072 status=none; then
                sudo chmod 600 "$EXTRA_SWAP" || true
                if sudo mkswap "$EXTRA_SWAP" >/dev/null 2>&1 && sudo swapon "$EXTRA_SWAP"; then
                  echo '==> Added 3 GiB ArenaMP linker swap'
                else
                  echo '::warning::Could not enable extra swap; continuing with existing RAM/swap'
                  sudo rm -f "$EXTRA_SWAP" 2>/dev/null || true
                fi
              else
                echo '::warning::Could not allocate extra swap; continuing with existing RAM/swap'
              fi
            else
              echo "==> Only ${AVAILABLE_MB:-unknown} MiB free on /; skipping extra swap"
            fi
          fi

          echo '==> Memory after swap check'
          free -h || true

      - name: Build ArenaMP native arm64
        working-directory: buildscripts
        run: bash ./build.sh --arch arm64 --ccache --release --client-server

      - name: Record successful ArenaMP incremental state
        if: success()
        shell: bash
        run: |
          PREFIX="buildscripts/build/arm64/arenamp-prefix"
          mkdir -p "$PREFIX"
          printf '%s\n' "$ARENAMP_PATCH_HASH" > "$PREFIX/.arenamp-android-patch-hash"
          printf '%s\n' "${{ steps.arenamp-source.outputs.target_sha }}" > "$PREFIX/.arenamp-upstream-sha"

      # GitHub cache entries are immutable, therefore every run writes a new key
      # and the next run restores the newest compatible prefix via restore-keys.
      # Save even after a compiler error: successfully produced .o files remain
      # useful for the next run and ccache provides a second level of reuse.
      - name: Save incremental ArenaMP build tree
        if: always()
        uses: actions/cache/save@v4
        with:
          path: buildscripts/build/arm64/arenamp-prefix
          key: ${{ env.ARENAMP_INCREMENTAL_CACHE_EPOCH }}-${{ hashFiles('buildscripts/build.sh', 'buildscripts/CMakeLists.txt', 'buildscripts/include/version.sh', 'buildscripts/patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Keep the complete compiler/linker log even when the native step fails.
      # This avoids the GitHub UI ending at "100%" with the real linker error hidden.
      - name: Prepare native failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p native-diagnostics
          cp -f buildscripts/build/arm64/arenamp-build.full.log native-diagnostics/ 2>/dev/null || true
          cp -f buildscripts/build/arm64/arenamp-prefix/src/arenamp-build/CMakeFiles/CMakeError.log native-diagnostics/ 2>/dev/null || true
          cp -f buildscripts/build/arm64/arenamp-prefix/src/arenamp-build/CMakeFiles/CMakeOutput.log native-diagnostics/ 2>/dev/null || true
          cp -f arenamp-changed-files.txt native-diagnostics/ 2>/dev/null || true
          cp -f arenamp-changed-cpp.txt native-diagnostics/ 2>/dev/null || true
          {
            echo '=== system ==='
            uname -a || true
            echo
            echo '=== memory ==='
            free -h || true
            echo
            echo '=== disk ==='
            df -h || true
            echo
            echo '=== native outputs ==='
            find buildscripts/build/arm64/arenamp-prefix/src/arenamp-build -maxdepth 2 -type f \
              \( -name 'libtes3mp.so' -o -name 'libarenamp_server.so' -o -name 'CMakeError.log' -o -name 'CMakeOutput.log' \) \
              -printf '%p %s bytes\n' 2>/dev/null || true
            echo
            echo '=== packaged jniLibs ==='
            find app/src/main/jniLibs -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null || true
          } > native-diagnostics/runner-state.txt

      - name: Upload native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ArenaMP-native-failure-${{ github.run_number }}
          path: native-diagnostics/*
          if-no-files-found: warn
          retention-days: 14

      - name: Verify ArenaMP client + server native payload
        shell: bash
        run: |
          test -f app/src/main/jniLibs/arm64-v8a/libtes3mp.so
          test -f app/src/main/jniLibs/arm64-v8a/libarenamp_server.so
          test -f buildscripts/prefix/arm64/lib/libRakNetLibStatic.a
          test -f buildscripts/prefix/arm64/lib/libluajit-5.1.a
          test -f buildscripts/prefix/arm64/include/luajit-2.1/lua.hpp
          test -f app/src/main/assets/libopenmw/openmw/tes3mp-client-default.cfg
          test -f app/src/main/assets/libopenmw/resources/mygui/RussoOne-Regular.ttf
          grep -q 'name="Russo"' app/src/main/assets/libopenmw/resources/mygui/openmw_font.xml
          test -f app/src/main/assets/arenamp-server/tes3mp-server-default.cfg
          test -f app/src/main/assets/arenamp-server/server/scripts/serverCore.lua
          test -f app/src/main/assets/arenamp-server/server/lib/lua/cjson.lua
          grep -q 'dkjson' app/src/main/assets/arenamp-server/server/lib/lua/cjson.lua
          test -f app/src/main/assets/libopenmw/arenamp-source-revision.txt
          test -f app/src/main/assets/arenamp-server/resources/version
          test -f app/src/main/assets/arenamp-server/runtime-stamp.txt

          ACTUAL_SOURCE="$(tr -d '\r\n' < app/src/main/assets/libopenmw/arenamp-source-revision.txt)"
          EXPECTED_SOURCE="${{ steps.arenamp-source.outputs.target_sha }}"
          CLIENT_COMPAT="$(sed -n '2p' app/src/main/assets/libopenmw/resources/version | tr -d '\r\n' | tr 'A-F' 'a-f')"
          SERVER_COMPAT="$(sed -n '2p' app/src/main/assets/arenamp-server/resources/version | tr -d '\r\n' | tr 'A-F' 'a-f')"
          EXPECTED_COMPAT="$(printf '%s' "$ARENAMP_NETWORK_COMMIT" | tr 'A-F' 'a-f')"

          if [[ "$ACTUAL_SOURCE" != "$EXPECTED_SOURCE" ]]; then
            echo "::error::Packaged AMP source is stale: packaged=$ACTUAL_SOURCE expected-main=$EXPECTED_SOURCE"
            exit 1
          fi
          if [[ "$CLIENT_COMPAT" != "$EXPECTED_COMPAT" || "$SERVER_COMPAT" != "$EXPECTED_COMPAT" ]]; then
            echo "::error::Network compatibility identity mismatch: client=$CLIENT_COMPAT server=$SERVER_COMPAT expected=$EXPECTED_COMPAT"
            exit 1
          fi
          echo "ArenaMP payload validated: source=${ACTUAL_SOURCE:0:10} (AMP/main), compatibility=${EXPECTED_COMPAT:0:10}."

      # A fresh debug keystore on every runner makes APK upgrades impossible.
      # Production builds should supply the SAME keystore as the installed app.
      - name: Restore development APK signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: arenamp-android-debug-signing-v1

      - name: Prepare release signing identity when configured
        env:
          ARENA_KEYSTORE_BASE64: ${{ secrets.ARENA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ARENA_KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$ARENA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arena-update.keystore"
            echo "ARENA_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/arena-update.keystore" >> "$GITHUB_ENV"
          fi

      - name: Verify updater and APK asset transactions
        run: |
          mkdir -p "$RUNNER_TEMP/arena-updater-tests"
          javac -source 8 -target 8 -d "$RUNNER_TEMP/arena-updater-tests" app/src/main/java/file/ContentUpdate.java app/src/main/java/file/AssetTransaction.java tests/ContentUpdateTest.java tests/AssetTransactionTest.java
          java -cp "$RUNNER_TEMP/arena-updater-tests" ContentUpdateTest
          java -cp "$RUNNER_TEMP/arena-updater-tests" AssetTransactionTest
          echo "ARENA_ANDROID_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build APK with original Gradle project
        env:
          ARENA_ANDROID_STORE_PASSWORD: ${{ secrets.ARENA_ANDROID_STORE_PASSWORD }}
          ARENA_ANDROID_KEY_ALIAS: ${{ secrets.ARENA_ANDROID_KEY_ALIAS }}
          ARENA_ANDROID_KEY_PASSWORD: ${{ secrets.ARENA_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testMainlineDebugUnitTest assembleMainlineDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/ArenaMP-arm64-client-server.apk
          sha256sum dist/ArenaMP-arm64-client-server.apk > dist/ArenaMP-arm64-client-server.apk.sha256

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArenaMP-Android-arm64-ClientServer
          path: dist/*
          if-no-files-found: error
